<svg width="600" height="500" viewBox="0 0 600 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Shield Border Gradient -->
    <linearGradient id="fullShieldGrad" x1="15" y1="10" x2="105" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#00a8ff" />
      <stop offset="50%" stopColor="#0066cc" />
      <stop offset="100%" stopColor="#003380" />
    </linearGradient>

    <!-- Water Droplet Gradient -->
    <linearGradient id="fullDropGrad" x1="38" y1="36" x2="78" y2="82" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#38bdf8" />
      <stop offset="40%" stopColor="#0284c7" />
      <stop offset="100%" stopColor="#0369a1" />
    </linearGradient>

    <!-- Leaves Gradient -->
    <linearGradient id="fullLeafGrad" x1="10" y1="45" x2="30" y2="75" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#4ade80" />
      <stop offset="50%" stopColor="#16a34a" />
      <stop offset="100%" stopColor="#15803d" />
    </linearGradient>

    <!-- Bottom Wave Gradient -->
    <linearGradient id="fullWaveGrad" x1="10" y1="88" x2="110" y2="102" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#0284c7" />
      <stop offset="100%" stopColor="#0369a1" />
    </linearGradient>
  </defs>

  <!-- Top Center Shield Emblem Group -->
  <g transform="translate(210, 20) scale(1.5)">
    <!-- Hexagonal Shield -->
    <path
      d="M60 8 L98 22 C98 22 102 60 98 72 C94 84 76 98 60 106 C44 98 26 84 22 72 C18 60 22 22 22 22 L60 8 Z"
      fill="#f0f9ff"
      stroke="url(#fullShieldGrad)"
      stroke-width="4.5"
      stroke-linejoin="round"
    />

    <!-- Early Warning Waves -->
    <path d="M44 26 C49 22 71 22 76 26" fill="none" stroke="#0284c7" stroke-width="2.8" stroke-linecap="round" />
    <path d="M49 32 C53 29 67 29 71 32" fill="none" stroke="#0284c7" stroke-width="2.4" stroke-linecap="round" />

    <!-- Circuit Sensor Traces -->
    <path d="M32 36 L38 36 L38 48 L32 48" fill="none" stroke="#0284c7" stroke-width="2" stroke-linecap="round" />
    <circle cx="32" cy="36" r="2.2" fill="#0284c7" />
    <circle cx="32" cy="48" r="2.2" fill="#0284c7" />
    <path d="M88 36 L82 36 L82 48 L88 48" fill="none" stroke="#0284c7" stroke-width="2" stroke-linecap="round" />
    <circle cx="88" cy="36" r="2.2" fill="#0284c7" />
    <circle cx="88" cy="48" r="2.2" fill="#0284c7" />

    <!-- Central Water Droplet -->
    <path
      d="M60 38 C60 38 78 60 78 72 C78 82 70 90 60 90 C50 90 42 82 42 72 C42 60 60 38 60 38 Z"
      fill="url(#fullDropGrad)"
      stroke="#ffffff"
      stroke-width="1.8"
    />

    <!-- Location Pin inside Drop -->
    <path d="M60 56 C56 56 53 59 53 63 C53 67.5 60 75 60 75 C60 75 67 67.5 67 63 C67 59 64 56 60 56 Z" fill="#ffffff" />
    <circle cx="60" cy="62" r="2.6" fill="#0284c7" />

    <!-- Wave Ripple -->
    <path d="M46 76 C50 73 54 77 60 74 C66 71 70 75 74 74" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" />

    <!-- Green Leaves -->
    <path d="M16 48 C14 36 28 34 28 34 C28 34 30 46 16 48 Z" fill="url(#fullLeafGrad)" stroke="#ffffff" stroke-width="0.8" />
    <path d="M10 60 C6 48 22 45 22 45 C22 45 26 58 10 60 Z" fill="url(#fullLeafGrad)" stroke="#ffffff" stroke-width="0.8" />
    <path d="M18 70 C10 60 26 56 26 56 C26 56 28 68 18 70 Z" fill="url(#fullLeafGrad)" stroke="#ffffff" stroke-width="0.8" />

    <!-- Bottom Wave Ribbons -->
    <path d="M12 82 C28 98 52 86 60 92 C68 98 92 88 108 82 C94 100 68 98 60 94 C52 90 28 102 12 82 Z" fill="url(#fullWaveGrad)" />
    <path d="M20 92 C34 105 52 96 60 100 C68 104 86 98 100 92 C88 106 68 106 60 102 C52 98 34 108 20 92 Z" fill="#22c55e" />
  </g>

  <!-- Typography Center -->
  <g transform="translate(0, 200)">
    <!-- "Jal Rakshak" -->
    <text x="300" y="50" text-anchor="middle" font-family="'Segoe UI', 'Poppins', Arial, sans-serif" font-weight="900" font-size="52" letter-spacing="-1">
      <tspan fill="#0284c7">Jal </tspan>
      <tspan fill="#0f172a">Rakshak</tspan>
    </text>

    <!-- Taglines -->
    <line x1="120" y1="75" x2="480" y2="75" stroke="#0284c7" stroke-width="2" stroke-linecap="round" />
    <circle cx="300" cy="75" r="4" fill="#22c55e" />

    <text x="300" y="98" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="800" font-size="14" fill="#0369a1" letter-spacing="3.5">
      PREDICT. PROTECT. RESPOND.
    </text>

    <text x="300" y="118" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="11" fill="#64748b" letter-spacing="2">
      AI-POWERED FLOOD INTELLIGENCE
    </text>
  </g>

  <!-- 4 Feature Badges Bottom Row -->
  <g transform="translate(60, 360)">
    <!-- 1: Early Warning -->
    <g transform="translate(0, 0)">
      <circle cx="45" cy="30" r="28" fill="#0284c7" />
      <path d="M35 30 C35 24 40 20 46 20 C51 20 55 24 55 28 C57 28 59 30 59 33 C59 36 56 38 53 38 L36 38 C33 38 31 36 31 33 C31 30 33 28 35 28" fill="#ffffff" />
      <line x1="39" y1="41" x2="37" y2="46" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
      <line x1="45" y1="41" x2="43" y2="46" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
      <line x1="51" y1="41" x2="49" y2="46" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
      <text x="45" y="74" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="800" font-size="10" fill="#0f172a">EARLY</text>
      <text x="45" y="86" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="800" font-size="10" fill="#0f172a">WARNING</text>
    </g>

    <!-- 2: Risk Prediction -->
    <g transform="translate(130, 0)">
      <circle cx="45" cy="30" r="28" fill="#16a34a" />
      <line x1="33" y1="38" x2="33" y2="30" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
      <line x1="41" y1="38" x2="41" y2="25" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
      <line x1="49" y1="38" x2="49" y2="20" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
      <path d="M32 26 L42 20 L57 16" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
      <path d="M52 16 L57 16 L57 21" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
      <text x="45" y="74" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="800" font-size="10" fill="#0f172a">RISK</text>
      <text x="45" y="86" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="800" font-size="10" fill="#0f172a">PREDICTION</text>
    </g>

    <!-- 3: Protect Lives -->
    <g transform="translate(260, 0)">
      <circle cx="45" cy="30" r="28" fill="#0284c7" />
      <path d="M45 18 L55 22 C55 30 51 36 45 40 C39 36 35 30 35 22 Z" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round" />
      <path d="M40 29 L44 33 L51 25" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      <text x="45" y="74" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="800" font-size="10" fill="#0f172a">PROTECT</text>
      <text x="45" y="86" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="800" font-size="10" fill="#0f172a">LIVES</text>
    </g>

    <!-- 4: Safer Tomorrow -->
    <g transform="translate(390, 0)">
      <circle cx="45" cy="30" r="28" fill="#16a34a" />
      <path d="M45 28 C45 28 42 20 48 20 C54 20 53 28 45 28 Z" fill="#ffffff" />
      <path d="M45 28 C45 28 40 24 38 27 C36 30 42 32 45 28 Z" fill="#ffffff" />
      <path d="M33 36 C35 34 38 35 41 37 C43 38 45 38 47 38 C50 38 54 35 57 36" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
      <text x="45" y="74" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="800" font-size="10" fill="#0f172a">SAFER</text>
      <text x="45" y="86" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="800" font-size="10" fill="#0f172a">TOMORROW</text>
    </g>
  </g>
</svg>
