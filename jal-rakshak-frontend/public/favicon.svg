<svg width="64" height="64" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background App Icon Gradient -->
    <linearGradient id="favBg" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#0284c7" />
      <stop offset="50%" stopColor="#0369a1" />
      <stop offset="100%" stopColor="#082f49" />
    </linearGradient>

    <!-- Shield Border Gradient -->
    <linearGradient id="favShieldGrad" x1="20" y1="12" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#38bdf8" />
      <stop offset="50%" stopColor="#ffffff" />
      <stop offset="100%" stopColor="#38bdf8" />
    </linearGradient>

    <!-- Water Droplet Gradient -->
    <linearGradient id="favDropGrad" x1="40" y1="36" x2="80" y2="84" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#38bdf8" />
      <stop offset="50%" stopColor="#0284c7" />
      <stop offset="100%" stopColor="#0369a1" />
    </linearGradient>

    <!-- Leaf Gradient -->
    <linearGradient id="favLeafGrad" x1="12" y1="46" x2="30" y2="76" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#4ade80" />
      <stop offset="100%" stopColor="#16a34a" />
    </linearGradient>
  </defs>

  <!-- App Icon Background Container -->
  <rect width="120" height="120" rx="28" fill="url(#favBg)" />

  <!-- Hexagonal Shield Outline -->
  <path
    d="M60 14 L96 26 C96 26 100 60 96 72 C92 84 74 96 60 104 C46 96 28 84 24 72 C20 60 24 26 24 26 L60 14 Z"
    fill="#0f172a"
    fill-opacity="0.3"
    stroke="url(#favShieldGrad)"
    stroke-width="4"
    stroke-linejoin="round"
  />

  <!-- Early Warning Radar Waves (Top) -->
  <path d="M46 29 C50 26 70 26 74 29" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
  <path d="M50 34 C53 32 67 32 70 34" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />

  <!-- Circuit Sensor Traces -->
  <path d="M34 38 L38 38 L38 48 L34 48" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  <circle cx="34" cy="38" r="2.2" fill="#38bdf8" />
  <circle cx="34" cy="48" r="2.2" fill="#38bdf8" />

  <path d="M86 38 L82 38 L82 48 L86 48" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  <circle cx="86" cy="38" r="2.2" fill="#38bdf8" />
  <circle cx="86" cy="48" r="2.2" fill="#38bdf8" />

  <!-- Central Water Droplet -->
  <path
    d="M60 40 C60 40 76 60 76 72 C76 81 69 88 60 88 C51 88 44 81 44 72 C44 60 60 40 60 40 Z"
    fill="url(#favDropGrad)"
    stroke="#ffffff"
    stroke-width="1.8"
  />

  <!-- Location Pin inside Drop -->
  <path d="M60 56 C56 56 53 59 53 63 C53 67 60 74 60 74 C60 74 67 67 67 63 C67 59 64 56 60 56 Z" fill="#ffffff" />
  <circle cx="60" cy="62" r="2.4" fill="#0284c7" />

  <!-- Wave Ripple -->
  <path d="M48 76 C52 73 56 77 60 75 C64 73 68 76 72 75" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />

  <!-- Green Leaves -->
  <path d="M18 50 C16 40 28 38 28 38 C28 38 30 48 18 50 Z" fill="url(#favLeafGrad)" />
  <path d="M12 60 C8 50 22 47 22 47 C22 47 26 58 12 60 Z" fill="url(#favLeafGrad)" />
  <path d="M20 68 C14 60 26 56 26 56 C26 56 28 66 20 68 Z" fill="url(#favLeafGrad)" />

  <!-- Bottom Wave Ribbons -->
  <path d="M16 82 C30 96 52 86 60 92 C68 98 90 88 104 82 C92 98 68 96 60 92 C52 88 30 100 16 82 Z" fill="#38bdf8" />
  <path d="M24 90 C36 102 52 94 60 98 C68 102 84 96 96 90 C86 102 68 104 60 100 C52 96 36 104 24 90 Z" fill="#22c55e" />
</svg>